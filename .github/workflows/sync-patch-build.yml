name: sync-patch-build

# 上游 account-password-helper 每次发版，自动嵌入 PassFiller 功能并重新打包发布。
# 失败策略：补丁失配 / typecheck / test / build 任一失败即红，需人工排查。

on:
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时轮询上游 release（:17 错开整点高峰）
  workflow_dispatch: # 手动触发：即使该版本已处理过也强制重新发布（pf 迭代号 +1）

permissions:
  contents: write
  pages: write # 用于自动开启 Pages（POST /repos/<repo>/pages）

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: liaolongdong/account-password-helper

jobs:
  # ── 判定：上游最新版本 + 是否需要处理 + pf 迭代号 ──────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      pf: ${{ steps.iter.outputs.pf }}
      skip: ${{ steps.iter.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve upstream latest release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "upstream: $TAG"

      # 已处理标记 = 本仓库自有 tag v{上游版本}-pf*；手动触发时强制重新发布
      - name: Determine pf iteration
        id: iter
        run: |
          set -euo pipefail
          VERSION=${{ steps.resolve.outputs.version }}
          N=$(git ls-remote --tags origin "refs/tags/v${VERSION}-pf*" | grep -c . || true)
          if [ "$N" -gt 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "pf=$((N + 1))" >> "$GITHUB_OUTPUT"
          fi

  # ── 构建发布：组装 → 验证 → 打包 → Release + Pages ────────────────────
  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
      PF_VERSION: ${{ needs.check.outputs.version }}.${{ needs.check.outputs.pf }}
      PF_TAG: v${{ needs.check.outputs.version }}-pf${{ needs.check.outputs.pf }}
      UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates.xml
    steps:
      - uses: actions/checkout@v5

      - name: Check CRX signing key configured
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::CRX_PRIVATE_KEY 未配置，构建终止。配置方法见 README「首次配置」。"
            {
              echo "## ❌ CRX_PRIVATE_KEY 未配置"
              echo ""
              echo "构建已失败。请在仓库 **Settings → Secrets and variables → Actions** 配置 \`CRX_PRIVATE_KEY\`（生成与配置步骤见 README「首次配置」）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CRX_PRIVATE_KEY 已配置，将生成 .crx 并部署 updates.xml"

      - name: Clone upstream source at tag
        run: git clone --depth 1 --branch "$UPSTREAM_TAG" "https://github.com/$UPSTREAM_REPO.git" upstream-src

      - uses: pnpm/action-setup@v5 # 版本取自根 package.json 的 packageManager（须与上游对齐）
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: upstream-src/pnpm-lock.yaml

      - name: Assemble (upstream + overlay + patches)
        run: node scripts/apply.js --src upstream-src --out assembled

      - name: Install dependencies
        working-directory: assembled
        env:
          HUSKY: '0' # 跳过上游 prepare 钩子（组装树不是 git 仓库）
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + test)
        working-directory: assembled
        run: |
          pnpm typecheck
          pnpm test:run

      - name: Build extension
        working-directory: assembled
        run: pnpm exec wxt build

      # update_url 注入 manifest（企业策略/crx 安装场景的自动更新入口；unpacked 场景无害）
      - name: Postprocess manifest
        working-directory: assembled
        run: node ../scripts/postprocess.js --out .output/chrome-mv3 --version "$PF_VERSION" --update-url "$UPDATE_URL"

      # 自研打包（wxt zip 会隐式 rebuild，覆盖 postprocess 注入的 manifest）
      - name: Package zip
        working-directory: assembled
        run: node ../scripts/package-artifacts.js --dir .output/chrome-mv3 --zip "../PassFiller-v${PF_VERSION}-chrome.zip"

      - name: Package CRX and updates.xml
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::CRX_PRIVATE_KEY 未配置，无法生成 crx，构建终止。"
            exit 1
          fi

          KEY="$RUNNER_TEMP/crx-private.pem"
          printf '%s\n' "$CRX_PRIVATE_KEY" > "$KEY"
          export CRX_KEY_PATH="$KEY"

          # 从私钥派生扩展 ID
          APP_ID=$(node -e 'const{createHash,createPublicKey}=require("node:crypto"),fs=require("fs");const k=createPublicKey(fs.readFileSync(process.env.CRX_KEY_PATH));const d=createHash("sha256").update(k.export({type:"spki",format:"der"})).digest().subarray(0,16);process.stdout.write([...d].flatMap(b=>["abcdefghijklmnop"[b>>4],"abcdefghijklmnop"[b&0xf]]).join(""))')
          echo "PF_APP_ID=$APP_ID" >> "$GITHUB_ENV"

          node scripts/package-artifacts.js --dir assembled/.output/chrome-mv3 \
            --crx "PassFiller-v${PF_VERSION}.crx" --key "$KEY" --appid "$APP_ID"
          rm -f "$KEY"

          # 生成 updates.xml，codebase 指向本 Release 的 crx
          CODEBASE_URL="https://github.com/${{ github.repository }}/releases/download/${PF_TAG}/PassFiller-v${PF_VERSION}.crx"
          mkdir -p pages
          cat > pages/updates.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='$APP_ID'>
              <updatecheck codebase='$CODEBASE_URL' version='$PF_VERSION'/>
            </app>
          </gupdate>
          EOF

      - name: Deploy updates.xml to GitHub Pages
        if: hashFiles('pages/updates.xml') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: pages

      # 自动开启 Pages：首次把 Source 设为 gh-pages；已存在返回 409 则忽略
      - name: Enable GitHub Pages (auto)
        if: hashFiles('pages/updates.xml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/${{ github.repository }}/pages" \
            --input - <<'JSON' || echo "Pages 已启用或已存在（409 可忽略）"
          {
            "build_type": "legacy",
            "source": { "branch": "gh-pages", "path": "/" }
          }
          JSON

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=("PassFiller-v${PF_VERSION}-chrome.zip")
          [ -f "PassFiller-v${PF_VERSION}.crx" ] && ASSETS+=("PassFiller-v${PF_VERSION}.crx")
          gh release create "$PF_TAG" "${ASSETS[@]}" \
            --title "PassFiller ${PF_VERSION}"
